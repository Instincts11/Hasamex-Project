[project]
name = "hasamex-backend"
version = "0.1.0"
description = "Hasamex evidence-first expert-call analysis backend"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[project.scripts]
hasamex-eval = "eval.run_eval:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "groq_env: test manages Groq-related environment variables",
    "groq_integration: live Groq API call; disabled unless HASAMEX_GROQ_INTEGRATION=1",
]
